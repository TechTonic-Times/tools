<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TechTonic Shorts Idea</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --teal-dark:#0f766e;
    --teal:#0d9488;
    --teal-light:#14b8a6;
    --teal-pale:#ccfbf1;
    --teal-bg:#f0fdfa;
    --white:#ffffff;
    --ink:#134e4a;
    --muted:#5f7a77;
    --border:#d3ece7;
    --danger:#e11d48;
  }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: var(--teal-bg);
    color: var(--ink);
    min-height:100vh;
    padding: 24px 16px 60px;
    overflow-x:hidden;
  }

  /* ===== Animated geometric background ===== */
  .geo-bg{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .geo-bg span{ position:absolute; display:block; opacity:.10; }
  .geo-bg .c1{ width:90px; height:90px; border-radius:50%; background:var(--teal); left:6%; top:12%; animation: drift1 11s ease-in-out infinite; }
  .geo-bg .c2{ width:40px; height:40px; border-radius:50%; background:var(--teal-dark); right:8%; top:8%; animation: drift2 9s ease-in-out infinite; }
  .geo-bg .c3{ width:140px; height:140px; border-radius:50%; border:22px solid var(--teal-light); left:-40px; bottom:8%; animation: drift1 14s ease-in-out infinite reverse; opacity:.08; }
  .geo-bg .s1{ width:56px; height:56px; background:var(--teal-light); left:12%; bottom:20%; transform:rotate(20deg); border-radius:12px; animation: spinFloat 13s linear infinite; }
  .geo-bg .s2{ width:34px; height:34px; background:var(--teal-dark); right:14%; bottom:32%; transform:rotate(-15deg); border-radius:8px; animation: spinFloat 10s linear infinite reverse; }
  .geo-bg .t1{ width:0; height:0; border-left:36px solid transparent; border-right:36px solid transparent; border-bottom:62px solid var(--teal); right:6%; top:42%; animation: drift2 12s ease-in-out infinite; }
  .geo-bg .t2{ width:0; height:0; border-left:22px solid transparent; border-right:22px solid transparent; border-bottom:38px solid var(--teal-light); left:4%; top:48%; animation: drift1 10s ease-in-out infinite; }
  .geo-bg .r1{ width:110px; height:110px; border-radius:50%; border:10px solid var(--teal-dark); right:-30px; bottom:6%; animation: drift2 15s ease-in-out infinite reverse; opacity:.07; }
  .geo-bg .d1{ width:26px; height:26px; background:var(--teal); left:45%; top:4%; transform:rotate(45deg); animation: spinFloat 8s linear infinite; border-radius:6px; }
  .geo-bg .d2{ width:18px; height:18px; background:var(--teal-light); left:80%; bottom:12%; transform:rotate(45deg); animation: drift1 9s ease-in-out infinite; border-radius:4px; }

  @keyframes drift1{ 0%,100%{ transform:translateY(0) translateX(0);} 50%{ transform:translateY(-34px) translateX(14px);} }
  @keyframes drift2{ 0%,100%{ transform:translateY(0) translateX(0);} 50%{ transform:translateY(28px) translateX(-16px);} }
  @keyframes spinFloat{ 0%{ transform:rotate(0deg) translateY(0);} 50%{ transform:rotate(180deg) translateY(-22px);} 100%{ transform:rotate(360deg) translateY(0);} }

  .wrap{ max-width:1100px; margin:0 auto; position:relative; z-index:1; }

  /* ===== Header ===== */
  .header{
    background: linear-gradient(135deg, #0b5e57 0%, var(--teal-dark) 35%, var(--teal) 70%, var(--teal-light) 100%);
    color:#fff;
    border-radius:20px;
    padding:32px 26px 28px;
    box-shadow: 0 12px 32px rgba(13,148,136,.28);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  /* moving shapes inside header */
  .header-shapes span{ position:absolute; display:block; pointer-events:none; }
  .header-shapes .hc1{ width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.10); right:-40px; top:-45px; animation: drift1 7s ease-in-out infinite; }
  .header-shapes .hc2{ width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.10); left:-25px; bottom:-30px; animation: drift2 8s ease-in-out infinite; }
  .header-shapes .hc3{ width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,.14); left:14%; top:18%; transform:rotate(20deg); animation: spinFloat 9s linear infinite; }
  .header-shapes .hc4{ width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent; border-bottom:30px solid rgba(255,255,255,.16); right:16%; bottom:20%; animation: drift1 6s ease-in-out infinite; }
  .header-shapes .hc5{ width:60px; height:60px; border-radius:50%; border:8px solid rgba(255,255,255,.14); left:38%; bottom:-20px; animation: drift2 10s ease-in-out infinite; }
  .header-shapes .hc6{ width:22px; height:22px; background:rgba(255,255,255,.2); right:28%; top:16%; transform:rotate(45deg); border-radius:5px; animation: spinFloat 7s linear infinite reverse; }

  .logo{
    width:56px; height:56px; margin:0 auto 12px;
    background:#fff; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    position:relative; z-index:1;
  }
  .header h1{ font-size:27px; font-weight:800; letter-spacing:.3px; position:relative; z-index:1; }
  .header p{ font-size:13.5px; opacity:.92; margin-top:6px; position:relative; z-index:1; }
  .count-badge{
    display:inline-flex; align-items:center; gap:7px;
    background: rgba(255,255,255,.20);
    border:1px solid rgba(255,255,255,.35);
    padding:7px 16px; border-radius:999px;
    font-size:13.5px; font-weight:700; margin-top:14px;
    position:relative; z-index:1;
  }

  /* ===== Download All - special bigger ===== */
  .download-all-wrap{ margin-top:16px; }
  .btn-download-all{
    width:100%;
    padding:18px 20px;
    border-radius:18px;
    border:none; cursor:pointer;
    color:#fff;
    background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
    box-shadow: 0 10px 28px rgba(13,148,136,.42), inset 0 1px 0 rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; gap:13px;
    transition:.2s;
    position:relative; overflow:hidden;
  }
  .btn-download-all::after{
    content:""; position:absolute; top:0; left:-70%; width:45%; height:100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.28), transparent);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{ 0%{left:-70%;} 60%,100%{left:130%;} }
  .btn-download-all:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(13,148,136,.48); filter:brightness(1.05); }
  .btn-download-all:active{ transform:scale(.98); }
  .btn-download-all .dl-icon{
    width:48px; height:48px; border-radius:14px;
    background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .dl-text{ text-align:left; line-height:1.25; }
  .dl-text strong{ font-size:20px; font-weight:800; letter-spacing:.3px; display:block; }
  .dl-text small{ font-size:12.5px; font-weight:500; opacity:.92; }
  .hint{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:8px; }

  /* ===== Cards ===== */
  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-top:16px;
    box-shadow: 0 4px 18px rgba(13,148,136,.08);
  }
  .add-row{ display:flex; gap:10px; }
  .add-row input{
    flex:1;
    border:2px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    font-size:15px;
    outline:none;
    color:var(--ink);
    background:#fbffff;
    transition:.2s;
    min-width:0;
  }
  .add-row input:focus{ border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px rgba(20,184,166,.15); }
  .btn{
    border:none; cursor:pointer; border-radius:12px;
    font-weight:700; font-size:14.5px;
    padding:13px 20px;
    transition: transform .12s, box-shadow .2s, background .2s;
    white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn svg{ flex-shrink:0; }
  .btn:active{ transform:scale(.97); }
  .btn-teal{ background:var(--teal); color:#fff; box-shadow:0 4px 12px rgba(13,148,136,.3); }
  .btn-teal:hover{ background:var(--teal-dark); }
  .btn-outline{ background:#fff; color:var(--teal-dark); border:2px solid var(--border); box-shadow:none; }
  .btn-outline:hover{ border-color:var(--teal); background:var(--teal-bg); }
  .btn-danger-outline{ background:#fff; color:var(--danger); border:2px solid #ffd7de; box-shadow:none; }
  .btn-danger-outline:hover{ background:#fff1f2; border-color:var(--danger); }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .toolbar .btn{ padding:11px 14px; font-size:13.5px; border-radius:11px; flex:1; min-width:110px; }

  .search-row{ margin-top:14px; position:relative; }
  .search-row input{
    width:100%;
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 14px 12px 42px;
    font-size:14px; outline:none; color:var(--ink); background:#fff;
  }
  .search-row input:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(20,184,166,.12); }
  .search-row .s-icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); display:flex; opacity:.55; }

  /* ===== List : responsive grid 1 / 2 / 3 columns ===== */
  .list-head{ display:flex; align-items:center; justify-content:space-between; margin:18px 4px 10px; gap:10px; flex-wrap:wrap; }
  .list-head h2{ font-size:16px; font-weight:800; }
  .list-head span{ font-size:13px; color:var(--muted); }
  #ideaList{ list-style:none; display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch; }
  @media (min-width:640px){ #ideaList{ grid-template-columns:repeat(2, 1fr); } }
  @media (min-width:1024px){ #ideaList{ grid-template-columns:repeat(3, 1fr); } }
  .idea{
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    display:flex; flex-direction:column;
    box-shadow:0 2px 10px rgba(13,148,136,.06);
    animation: slideIn .25s ease;
    min-width:0;
  }
  @keyframes slideIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  /* Line 1 : full title (no numbers) */
  .idea-top{ display:flex; align-items:flex-start; margin-bottom:12px; }
  .idea-title{ flex:1; font-size:19px; font-weight:600; line-height:1.55; word-break:break-word; min-width:0; }
  /* Line 2 : action buttons on their own row, pinned to card bottom */
  .idea-actions{
    display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
    margin-top:auto; padding-top:10px;
    border-top:1px dashed var(--border);
  }
  .icon-btn{
    height:36px; padding:0 14px; border-radius:10px;
    border:1.5px solid var(--border);
    background:#fff; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-size:13.5px; font-weight:700;
    transition:.15s; color:var(--teal-dark);
  }
  .icon-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 8px rgba(0,0,0,.08); }
  .icon-btn.act-edit:hover{ border-color:var(--teal); background:var(--teal-bg); }
  .icon-btn.act-copy:hover{ border-color:#0ea5e9; background:#f0f9ff; color:#0284c7; }
  .icon-btn.act-del{ color:var(--danger); }
  .icon-btn.act-del:hover{ border-color:var(--danger); background:#fff1f2; }
  .edit-input{
    flex:1; border:2px solid var(--teal); border-radius:10px;
    padding:10px 12px; font-size:18px; outline:none; color:var(--ink); min-width:0; width:100%;
  }
  .idea-edit-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:auto; padding-top:10px; border-top:1px dashed var(--border); }
  .edit-save{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:0 18px; height:38px; font-weight:700; cursor:pointer; font-size:13px;}
  .edit-save:hover{ background:var(--teal-dark); }
  .edit-cancel{ background:#f1f5f9; color:#475569; border:none; border-radius:10px; padding:0 16px; height:38px; font-weight:700; cursor:pointer; font-size:13px;}

  /* ===== Pagination ===== */
  #pagination{ display:none; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; margin-top:18px; }
  #pagination.visible{ display:flex; }
  .pg-btn{
    min-width:40px; height:40px; padding:0 13px; border-radius:11px;
    border:1.5px solid var(--border); background:#fff; color:var(--teal-dark);
    font-size:13.5px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .pg-btn:hover:not(:disabled){ border-color:var(--teal); background:var(--teal-bg); transform:translateY(-1px); }
  .pg-btn.active{ background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 3px 10px rgba(13,148,136,.3); }
  .pg-btn:disabled{ opacity:.4; cursor:default; }
  .pg-info{ width:100%; text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:2px; }
  .pg-dots{ color:var(--muted); font-weight:800; padding:0 2px; }

  .empty{
    text-align:center; padding:38px 20px;
    background:#fff; border:2px dashed var(--border); border-radius:16px;
    color:var(--muted);
  }
  .empty-icon{
    width:64px; height:64px; margin:0 auto 12px; border-radius:50%;
    background:var(--teal-bg); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .empty h3{ color:var(--teal-dark); font-size:16px; margin-bottom:4px; }
  .empty p{ font-size:13.5px; }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:#fff;
    padding:12px 22px; border-radius:999px;
    font-size:14px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    transition: transform .3s ease;
    z-index:99; max-width:90vw; text-align:center;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .header h1{ font-size:22px; }
    .add-row{ flex-direction:column; }
    .add-row .btn{ width:100%; }
  }
</style>
</head>
<body>

<!-- floating background geometry -->
<div class="geo-bg" aria-hidden="true">
  <span class="c1"></span><span class="c2"></span><span class="c3"></span>
  <span class="s1"></span><span class="s2"></span>
  <span class="t1"></span><span class="t2"></span>
  <span class="r1"></span><span class="d1"></span><span class="d2"></span>
</div>

<div class="wrap">

  <div class="header">
    <div class="header-shapes" aria-hidden="true">
      <span class="hc1"></span><span class="hc2"></span><span class="hc3"></span>
      <span class="hc4"></span><span class="hc5"></span><span class="hc6"></span>
    </div>
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="#0d9488" stroke="#0f766e" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <h1>TechTonic Shorts Idea</h1>
    <p>Save all your shorts titles in one place</p>
    <div class="count-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span><span id="count">0</span> Ideas Saved</span>
    </div>
  </div>

  <div class="card">
    <div class="add-row">
      <input type="text" id="ideaInput" placeholder="Type your shorts title here..." maxlength="200" autocomplete="off" />
      <button class="btn btn-teal" id="btnAdd" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
  </div>

  <div class="search-row">
    <span class="s-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    </span>
    <input type="text" id="searchInput" placeholder="Search ideas..." autocomplete="off" />
  </div>

  <!-- Download All - after Add + Search -->
  <div class="download-all-wrap">
    <button class="btn-download-all" id="btnDownloadAll" type="button">
      <span class="dl-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </span>
      <span class="dl-text"><strong>Download All (.txt)</strong><small>All your titles in one clean text file</small></span>
    </button>
    <div class="hint">Downloads a .txt file with all your shorts titles</div>
  </div>

  <div class="toolbar">
    <button class="btn btn-outline" id="btnImport" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Import
    </button>
    <button class="btn btn-outline" id="btnExport" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Export
    </button>
    <button class="btn btn-danger-outline" id="btnClear" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear
    </button>
    <input type="file" id="fileInput" accept=".txt,.json,text/plain,application/json" style="display:none" />
  </div>

  <div class="list-head">
    <h2>Your Ideas</h2>
    <span id="shownCount"></span>
  </div>

  <ul id="ideaList"></ul>

  <div id="pagination"></div>

  <div id="emptyState" class="empty">
    <div class="empty-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
    </div>
    <h3 id="emptyTitle">No ideas yet</h3>
    <p id="emptySub">Add your first shorts title above to get started!</p>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = 'techtonic_shorts_ideas';
  var PAGE_SIZE = 100;
  var ideas = [];
  var editingIndex = -1;
  var filterText = '';
  var currentPage = 1;

  var els = {};
  ['ideaList','pagination','emptyState','emptyTitle','emptySub','count','shownCount','ideaInput','searchInput','fileInput','toast','btnAdd','btnImport','btnExport','btnClear','btnDownloadAll'].forEach(function(id){
    els[id] = document.getElementById(id);
  });

  var ICONS = {
    copy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
    del: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
  };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(Array.isArray(p)) ideas = p.filter(function(x){ return typeof x === 'string' && x.trim(); });
      }
    }catch(e){ /* storage blocked in preview iframe - use memory */ }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(ideas)); }catch(e){}
  }

  var toastTimer = null;
  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ els.toast.classList.remove('show'); }, 2200);
  }

  function addIdea(){
    var val = els.ideaInput.value.trim();
    if(!val){ toast('Please type a title first'); els.ideaInput.focus(); return; }
    ideas.unshift(val);
    els.ideaInput.value = '';
    editingIndex = -1;
    currentPage = 1;
    save(); render();
    toast('Idea added');
    els.ideaInput.focus();
  }

  function saveEdit(){
    var inp = document.getElementById('editInput');
    if(!inp || editingIndex < 0) return;
    var val = inp.value.trim();
    if(!val){ toast('Title cannot be empty'); inp.focus(); return; }
    ideas[editingIndex] = val;
    editingIndex = -1;
    save(); render();
    toast('Idea updated');
  }
  function cancelEdit(){ editingIndex = -1; render(); }

  function deleteIdea(i){
    if(i < 0 || i >= ideas.length) return;
    ideas.splice(i,1);
    if(editingIndex === i) editingIndex = -1;
    save(); render();
    toast('Idea deleted');
  }

  function copyIdea(i){
    var text = ideas[i];
    if(text == null) return;
    function ok(){ toast('Copied to clipboard'); }
    function fail(){ toast('Copy failed'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok, fail); });
    } else fallbackCopy(text, ok, fail);
  }
  function fallbackCopy(text, ok, fail){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta);
      done ? ok() : fail();
    }catch(e){ fail(); }
  }

  function clearAll(){
    if(ideas.length === 0){ toast('Nothing to clear'); return; }
    if(confirm('Delete ALL ' + ideas.length + ' ideas? This cannot be undone.')){
      ideas = []; editingIndex = -1; currentPage = 1;
      save(); render();
      toast('All ideas cleared');
    }
  }

  function downloadFile(name, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }

  function fileStamp(){
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
           '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }

  function downloadAll(){
    if(ideas.length === 0){ toast('No ideas to download'); return; }
    var lines = [];
    lines.push('TechTonic Shorts Ideas');
    lines.push('Exported: ' + new Date().toLocaleString());
    lines.push('Total: ' + ideas.length);
    lines.push('===================================');
    lines.push('');
    for(var k=0; k<ideas.length; k++){ lines.push((k+1) + '. ' + ideas[k]); }
    downloadFile('techtonic-idea-' + fileStamp() + '.txt', lines.join('\n'), 'text/plain;charset=utf-8');
    toast('Downloaded ' + ideas.length + ' ideas (.txt)');
  }

  function exportJSON(){
    if(ideas.length === 0){ toast('No ideas to export'); return; }
    var data = JSON.stringify({app:'TechTonic Shorts Idea', exported:new Date().toISOString(), count:ideas.length, ideas:ideas}, null, 2);
    downloadFile('TechTonic-Shorts-Ideas.json', data, 'application/json');
    toast('Exported ' + ideas.length + ' ideas (.json)');
  }

  function importFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var content = String(reader.result || '');
      var imported = [];
      try{
        if(/\.json$/i.test(file.name)){
          var parsed = JSON.parse(content);
          if(Array.isArray(parsed)) imported = parsed;
          else if(parsed && Array.isArray(parsed.ideas)) imported = parsed.ideas;
          else throw new Error('bad json');
          imported = imported.filter(function(x){ return typeof x === 'string'; }).map(function(s){ return s.trim(); }).filter(Boolean);
        } else {
          imported = content.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean)
            .map(function(s){ return s.replace(/^\d+[\.\)\-:]\s*/, '').trim(); }).filter(Boolean)
            .filter(function(s){ return !/^TechTonic Shorts Ideas$/i.test(s) && !/^Exported:/i.test(s) && !/^Total:/i.test(s) && !/^=+$/.test(s); });
        }
      }catch(err){ toast('Could not read file'); els.fileInput.value=''; return; }
      if(imported.length === 0){ toast('No ideas found in file'); els.fileInput.value=''; return; }
      ideas = imported.concat(ideas);
      editingIndex = -1;
      currentPage = 1;
      save(); render();
      toast('Imported ' + imported.length + ' ideas');
      els.fileInput.value='';
    };
    reader.onerror = function(){ toast('Could not read file'); els.fileInput.value=''; };
    reader.readAsText(file);
  }

  function pageList(cur, total){
    var arr = [];
    var i;
    if(total <= 7){ for(i=1;i<=total;i++) arr.push(i); return arr; }
    var want = [1, 2, cur-1, cur, cur+1, total-1, total];
    var seen = {};
    var nums = [];
    for(var k=0;k<want.length;k++){
      var n = want[k];
      if(n >= 1 && n <= total && !seen[n]){ seen[n] = 1; nums.push(n); }
    }
    nums.sort(function(a,b){ return a-b; });
    for(var j=0;j<nums.length;j++){
      if(j > 0 && nums[j] - nums[j-1] > 1) arr.push('...');
      arr.push(nums[j]);
    }
    return arr;
  }

  function renderPagination(total, totalPages){
    while(els.pagination.firstChild){ els.pagination.removeChild(els.pagination.firstChild); }
    if(total === 0){ els.pagination.classList.remove('visible'); return; }
    els.pagination.classList.add('visible');

    var start = (currentPage-1)*PAGE_SIZE + 1;
    var end = Math.min(total, currentPage*PAGE_SIZE);
    var info = document.createElement('div');
    info.className = 'pg-info';
    info.textContent = 'Showing ' + start + '–' + end + ' of ' + total + '  •  Page ' + currentPage + ' of ' + totalPages;
    els.pagination.appendChild(info);

    if(totalPages <= 1) return;

    function pgBtn(label, page, disabled, active, aria){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pg-btn' + (active ? ' active' : '');
      b.textContent = label;
      if(aria) b.setAttribute('aria-label', aria);
      if(disabled){ b.disabled = true; }
      else { b.setAttribute('data-page', String(page)); }
      els.pagination.appendChild(b);
    }

    pgBtn('‹ Prev', currentPage-1, currentPage === 1, false, 'Previous page');
    var pages = pageList(currentPage, totalPages);
    for(var i=0;i<pages.length;i++){
      if(pages[i] === '...'){
        var dots = document.createElement('span');
        dots.className = 'pg-dots';
        dots.textContent = '…';
        els.pagination.appendChild(dots);
      } else {
        pgBtn(String(pages[i]), pages[i], false, pages[i] === currentPage, 'Page ' + pages[i]);
      }
    }
    pgBtn('Next ›', currentPage+1, currentPage === totalPages, false, 'Next page');
  }

  function render(){
    // update counts
    els.count.textContent = String(ideas.length);

    // clear list
    while(els.ideaList.firstChild){ els.ideaList.removeChild(els.ideaList.firstChild); }

    // filter
    var q = filterText.toLowerCase();
    var items = [];
    for(var i=0;i<ideas.length;i++){
      if(!q || ideas[i].toLowerCase().indexOf(q) !== -1){ items.push({text: ideas[i], index: i}); }
    }

    // paginate: 100 cards per page
    var total = items.length;
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;
    var pageItems = items.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);
    var start = total === 0 ? 0 : (currentPage-1)*PAGE_SIZE + 1;
    var end = Math.min(total, currentPage*PAGE_SIZE);

    els.shownCount.textContent = total === 0 ? '' : ('Showing ' + start + '–' + end + ' of ' + total + (q ? ' matches' : ' total'));

    if(total === 0){
      els.emptyState.style.display = 'block';
      if(q){ els.emptyTitle.textContent = 'No matching ideas'; els.emptySub.textContent = 'Try a different search.'; }
      else { els.emptyTitle.textContent = 'No ideas yet'; els.emptySub.textContent = 'Add your first shorts title above to get started!'; }
    } else {
      els.emptyState.style.display = 'none';
    }

    // build cards (current page only, no numbers)
    for(var p=0; p<pageItems.length; p++){
      (function(item){
        var li = document.createElement('li');
        li.className = 'idea';

        // Line 1 : full-width title
        var top = document.createElement('div');
        top.className = 'idea-top';

        if(item.index === editingIndex){
          var inp = document.createElement('input');
          inp.className = 'edit-input';
          inp.id = 'editInput';
          inp.type = 'text';
          inp.maxLength = 200;
          inp.value = item.text;
          top.appendChild(inp);
          li.appendChild(top);

          // Line 2 : save / cancel on their own row
          var editActs = document.createElement('div');
          editActs.className = 'idea-edit-actions';

          var bSave = document.createElement('button');
          bSave.className = 'edit-save'; bSave.type = 'button'; bSave.textContent = 'Save';
          bSave.setAttribute('data-action','save');
          editActs.appendChild(bSave);

          var bCancel = document.createElement('button');
          bCancel.className = 'edit-cancel'; bCancel.type = 'button'; bCancel.textContent = 'Cancel';
          bCancel.setAttribute('data-action','cancel');
          editActs.appendChild(bCancel);

          li.appendChild(editActs);
        } else {
          var title = document.createElement('span');
          title.className = 'idea-title';
          title.textContent = item.text;
          top.appendChild(title);
          li.appendChild(top);

          // Line 2 : Copy / Edit / Delete on their own row
          var acts = document.createElement('div');
          acts.className = 'idea-actions';

          var bCopy = document.createElement('button');
          bCopy.className = 'icon-btn act-copy'; bCopy.type='button'; bCopy.title='Copy';
          bCopy.innerHTML = ICONS.copy + '<span>Copy</span>';
          bCopy.setAttribute('data-action','copy');
          bCopy.setAttribute('data-index', String(item.index));
          acts.appendChild(bCopy);

          var bEdit = document.createElement('button');
          bEdit.className = 'icon-btn act-edit'; bEdit.type='button'; bEdit.title='Edit';
          bEdit.innerHTML = ICONS.edit + '<span>Edit</span>';
          bEdit.setAttribute('data-action','edit');
          bEdit.setAttribute('data-index', String(item.index));
          acts.appendChild(bEdit);

          var bDel = document.createElement('button');
          bDel.className = 'icon-btn act-del'; bDel.type='button'; bDel.title='Delete';
          bDel.innerHTML = ICONS.del + '<span>Delete</span>';
          bDel.setAttribute('data-action','delete');
          bDel.setAttribute('data-index', String(item.index));
          acts.appendChild(bDel);

          li.appendChild(acts);
        }
        els.ideaList.appendChild(li);
      })(pageItems[p]);
    }

    renderPagination(total, totalPages);

    // focus edit input if editing
    if(editingIndex >= 0){
      var ei = document.getElementById('editInput');
      if(ei){ ei.focus(); ei.select(); }
    }
  }

  // ===== Events (no inline onclick - robust delegation) =====
  els.btnAdd.addEventListener('click', addIdea);
  els.ideaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addIdea(); } });
  els.searchInput.addEventListener('input', function(){ filterText = els.searchInput.value.trim(); currentPage = 1; render(); });
  els.btnDownloadAll.addEventListener('click', downloadAll);
  els.btnExport.addEventListener('click', exportJSON);
  els.btnClear.addEventListener('click', clearAll);
  els.btnImport.addEventListener('click', function(){ els.fileInput.click(); });
  els.fileInput.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importFile(e.target.files[0]);
  });

  els.ideaList.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button') : null;
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    if(action === 'save'){ saveEdit(); return; }
    if(action === 'cancel'){ cancelEdit(); return; }
    var idx = parseInt(btn.getAttribute('data-index'), 10);
    if(isNaN(idx)) return;
    if(action === 'copy') copyIdea(idx);
    else if(action === 'edit'){ editingIndex = idx; render(); }
    else if(action === 'delete') deleteIdea(idx);
  });

  els.ideaList.addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'editInput'){
      if(e.key === 'Enter'){ e.preventDefault(); saveEdit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
    }
  });

  els.pagination.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-page]') : null;
    if(!btn || btn.disabled) return;
    var pg = parseInt(btn.getAttribute('data-page'), 10);
    if(isNaN(pg)) return;
    currentPage = pg;
    editingIndex = -1;
    render();
    var head = document.querySelector('.list-head');
    if(head && head.scrollIntoView){ try{ head.scrollIntoView(); }catch(err){} }
  });

  load();
  render();
})();
</script>
</body>
</html>
